<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0E17"/>
      <stop offset="0.55" stop-color="#11162A"/>
      <stop offset="1" stop-color="#0B0E17"/>
    </linearGradient>
    <linearGradient id="heroText" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="heroBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="heroClip"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <style>
    .orbA { animation: floatA 7s ease-in-out infinite; transform-origin: center; }
    .orbB { animation: floatB 9s ease-in-out infinite; transform-origin: center; }
    @keyframes floatA {
      0%,100% { transform: translate(0px,0px) scale(1); }
      50% { transform: translate(30px,-20px) scale(1.12); }
    }
    @keyframes floatB {
      0%,100% { transform: translate(0px,0px) scale(1); }
      50% { transform: translate(-25px,18px) scale(1.08); }
    }
    .title-base { fill:#F5F5FA; font: 800 54px "Segoe UI", Helvetica, Arial, sans-serif; }
    .title-glow { fill:url(#heroText); font: 800 54px "Segoe UI", Helvetica, Arial, sans-serif;
      animation: glowPulse 4s ease-in-out infinite; }
    @keyframes glowPulse {
      0%,100% { opacity: 0.15; }
      50% { opacity: 0.95; }
    }
    .subtitle { fill:#9CA3C4; font: 500 20px "Segoe UI", Helvetica, Arial, sans-serif;
      letter-spacing: 1.5px; animation: fadeIn 2.4s ease-out; }
    @keyframes fadeIn { 0% { opacity:0; transform: translateY(8px);} 100% { opacity:1; transform: translateY(0);} }
    .rule { stroke:url(#heroText); stroke-width:2; stroke-linecap:round;
      stroke-dasharray: 180 400; animation: dash 3.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -580; } }
    .bar { fill:url(#heroBar); transform-box: fill-box; transform-origin: bottom;
      animation-name: eq; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    @keyframes eq {
      0%,100% { transform: scaleY(0.25); opacity:0.55; }
      50% { transform: scaleY(1); opacity:1; }
    }
  </style>

  <g clip-path="url(#heroClip)">
    <rect width="1200" height="320" fill="url(#heroBg)"/>
    <circle class="orbA" cx="150" cy="90" r="150" fill="url(#orb1)" filter="url(#blurBig)"/>
    <circle class="orbB" cx="1040" cy="230" r="170" fill="url(#orb2)" filter="url(#blurBig)"/>

    <text x="600.0" y="140" text-anchor="middle" class="title-base">Full-Stack Developer</text>
    <text x="600.0" y="140" text-anchor="middle" class="title-glow">Full-Stack Developer</text>

