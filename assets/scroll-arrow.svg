<svg width="40" height="70" viewBox="0 0 40 70" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="chevGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <style>
    .c1 { animation: bounce 1.6s ease-in-out infinite; }
    .c2 { animation: bounce 1.6s ease-in-out infinite; animation-delay: 0.25s; }
    @keyframes bounce {
      0%,100% { opacity:0.25; transform: translateY(-4px); }
      50%      { opacity:1;    transform: translateY(6px); }
    }
  </style>
  <path class="c1" d="M8 18 L20 30 L32 18" stroke="url(#chevGrad)" stroke-width="4"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="c2" d="M8 34 L20 46 L32 34" stroke="url(#chevGrad)" stroke-width="4"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
