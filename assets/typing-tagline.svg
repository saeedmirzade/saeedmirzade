<svg width="760" height="64" viewBox="0 0 760 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tagGrad" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <style>
    .line {
      fill: url(#tagGrad);
      font: 600 22px "Fira Code", "Segoe UI", monospace;
      opacity: 0;
      animation-name: fadeCycle;
      animation-duration: 9s;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }
    @keyframes fadeCycle {
      0%   { opacity: 0; }
      4%   { opacity: 1; }
      29%  { opacity: 1; }
      34%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .cursor { fill: #EC4899; animation: blink 0.9s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <text x="380.0" y="40.0" text-anchor="middle" class="line" style="animation-delay:0s">Building scalable web &amp; mobile apps since 2022</text>
    <text x="380.0" y="40.0" text-anchor="middle" class="line" style="animation-delay:-3s">React.js  •  React Native  •  Node.js  •  TypeScript</text>
    <text x="380.0" y="40.0" text-anchor="middle" class="line" style="animation-delay:-6s">Team Member at Hiprax</text>
</svg>
