<svg width="1200" height="84" viewBox="0 0 1200 84" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g12" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="shine12" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip12"><rect width="1200" height="84" rx="14"/></clipPath>
  </defs>
  <style>
    .tab12 { animation: pulse12 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse12 {
      0%,100% { opacity:0.7; transform:scaleY(0.85); }
      50%      { opacity:1;   transform:scaleY(1); }
    }
    .shine12 { animation: sweep12 3.4s linear infinite; animation-delay: 2.0s; }
    @keyframes sweep12 {
      0%   { transform: translateX(-720px); }
      100% { transform: translateX(1200px); }
    }
    .name12 { fill:#F2F3FA; font:700 24px "Segoe UI",sans-serif; }
  </style>
  <g clip-path="url(#clip12)">
    <rect width="1200" height="84" fill="#11162A"/>
    <rect width="1200" height="84" fill="none" stroke="#242A42"/>
    <rect class="tab12" x="0" y="18" width="6" height="48" rx="3" fill="url(#g12)"/>
    <text x="34" y="50.0" class="name12">Ticketing Management System</text>
    <g class="shine12">
      <rect x="0" y="0" width="420" height="84" fill="url(#shine12)" transform="skewX(-20)"/>
    </g>
  </g>
</svg>
