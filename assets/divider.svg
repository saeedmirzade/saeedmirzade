<svg width="1200" height="26" viewBox="0 0 1200 26" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="travel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="1"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <style>
    .base { stroke:#2A2F45; stroke-width:1.5; }
    .comet { animation: travel 3.6s linear infinite; }
    @keyframes travel {
      0%   { transform: translateX(-260px); }
      100% { transform: translateX(1200px); }
    }
  </style>
  <line x1="0" y1="13.0" x2="1200" y2="13.0" class="base"/>
  <g class="comet" filter="url(#softBlur)">
    <rect x="0" y="11.0" width="260" height="4" rx="2" fill="url(#travel)"/>
  </g>
</svg>
