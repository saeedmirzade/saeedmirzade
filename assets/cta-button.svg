<svg width="460" height="84" viewBox="0 0 460 84" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="460" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="ctaBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <style>
    .glow { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; }
    @keyframes pulse {
      0%,100% { opacity:0.35; transform:scale(0.97); }
      50%      { opacity:0.75; transform:scale(1.04); }
    }
    .pill { animation: lift 2.6s ease-in-out infinite; transform-origin: center; }
    @keyframes lift {
      0%,100% { transform: translateY(0px); }
      50%      { transform: translateY(-3px); }
    }
    .label { fill:#ffffff; font:700 19px "Segoe UI",sans-serif; }
    .arrow { animation: nudge 1.4s ease-in-out infinite; }
    @keyframes nudge {
      0%,100% { transform: translateX(0); }
      50%      { transform: translateX(6px); }
    }
  </style>

  <rect class="glow" x="30" y="18" width="400" height="48" rx="24" fill="url(#ctaGrad)" filter="url(#ctaBlur)"/>

  <g class="pill">
    <rect x="20" y="12" width="420" height="60" rx="30" fill="url(#ctaGrad)"/>
    <text x="216.0" y="49.0" text-anchor="middle" class="label">View My Work &amp; Experience</text>
    <g class="arrow" transform="translate(402,34.0)">
      <path d="M0 8 L14 8 M8 1 L15 8 L8 15" stroke="#ffffff" stroke-width="2.4"
            fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
