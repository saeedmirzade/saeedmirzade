<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="footBg" x1="0" y1="0" x2="1200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0E17"/>
      <stop offset="0.5" stop-color="#11162A"/>
      <stop offset="1" stop-color="#0B0E17"/>
    </linearGradient>
    <linearGradient id="footText" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="footBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="footOrb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="fblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <clipPath id="footClip"><rect width="1200" height="200" rx="20"/></clipPath>
  </defs>
  <style>
    .bar { fill:url(#footBar); transform-box: fill-box; transform-origin: bottom;
      animation-name: eq; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
    @keyframes eq {
      0%,100% { transform: scaleY(0.3); opacity:0.5; }
      50% { transform: scaleY(1); opacity:1; }
    }
    .orb { animation: drift 8s ease-in-out infinite; transform-origin: center; }
    @keyframes drift {
      0%,100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(20px,-10px) scale(1.1); }
    }
    .ftitle { fill:url(#footText); font:700 34px "Segoe UI",sans-serif;
      animation: glow 4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity:0.7; } 50% { opacity:1; } }
    .fsub { fill:#8A90B8; font:500 16px "Segoe UI",sans-serif; letter-spacing:1px; }
  </style>
